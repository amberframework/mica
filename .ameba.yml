# Each method listed below is one flat dispatch (a case over byte classes,
# token kinds, XPath axes or function names) on the scanner's or the XPath
# evaluator's hot path. Splitting them to satisfy the metric would add calls
# per byte or per node without making the dispatch easier to read.
Metrics/CyclomaticComplexity:
  Excluded:
    - src/mica/core/utf8.cr
    - src/mica/core/encoding.cr
    - src/mica/core/transcoder.cr
    - src/mica/xml/char_class.cr
    - src/mica/xml/escape.cr
    - src/mica/xml/reader/content.cr
    - src/mica/xml/reader/dtd_parser.cr
    - src/mica/xml/reader/prolog.cr
    - src/mica/xml/reader/references.cr
    - src/mica/xml/reader/scanning.cr
    - src/mica/xml/reader/source.cr
    - src/mica/xml/xpath/evaluator.cr
    - src/mica/xml/xpath/lexer.cr

# Scratch programs (git-ignored) are not part of the library.
Excluded:
  - tmp/**
  - lib/**
