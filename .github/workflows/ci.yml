name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Check formatting
        run: crystal tool format --check src spec
      - name: Fetch the YAML test suite (pinned commit, sha256 verified)
        run: ruby conformance/yaml/fetch_suite.rb
      - name: Fetch the HPACK test cases (pinned commit, sha256 verified)
        run: ruby conformance/hpack/fetch_test_case.rb
      - name: Fetch the Encoding Standard and WPT vectors (pinned commits, sha256 verified)
        run: ruby conformance/encoding/fetch_vectors.rb
      - name: Fetch the Brotli test files (pinned commit, sha256 verified)
        run: ruby conformance/brotli/fetch_testdata.rb
      - name: Run specs
        run: crystal spec

  encoding-conformance:
    # web-platform-tests encoding/ against Mica, the WPT reference codecs and
    # ICU as a second opinion, and a report of every difference from glibc
    # iconv (docs/encoding.md explains each kind).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Fetch the Encoding Standard and WPT vectors (pinned commits, sha256 verified)
        run: ruby conformance/encoding/fetch_vectors.rb
      - name: Build the oracle
        run: mkdir -p bin && crystal build --release conformance/encoding/oracle.cr -o bin/encoding_oracle
      - name: web-platform-tests encoding/
        run: node conformance/encoding/wpt_runner.js bin/encoding_oracle
      - name: Differential against the WPT reference codecs and ICU
        run: SEED=20261122 CASES=20000 node conformance/encoding/differential.js bin/encoding_oracle
      - name: Differences from glibc iconv (report)
        run: |
          crystal build --release conformance/encoding/iconv_differential.cr -o bin/iconv_differential
          bin/iconv_differential 20261122 3000 iconv-differential-glibc.tsv | tee iconv-differential-glibc.txt

  spec-macos:
    # Apple silicon with the stock compiler, whose default target CPU does
    # not declare the CRC extension the CRC-32 instructions belong to.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.22.2
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Run the Deflate specs
        run: crystal spec spec/deflate
