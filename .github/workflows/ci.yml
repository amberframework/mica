name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Check formatting
        run: crystal tool format --check src spec
      - name: Fetch the YAML test suite (pinned commit, sha256 verified)
        run: ruby conformance/yaml/fetch_suite.rb
      - name: Run specs
        run: crystal spec

  spec-macos:
    # Apple silicon with the stock compiler, whose default target CPU does
    # not declare the CRC extension the CRC-32 instructions belong to.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.22.2
      - name: Install dependencies
        run: shards install --frozen --skip-postinstall --skip-executables
      - name: Run the Deflate specs
        run: crystal spec spec/deflate
