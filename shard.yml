name: mica
version: 0.1.1

authors:
  - AgentC Consulting <agent_c@agentc.consulting>

description: |
  Pure-Crystal parsing of untrusted input to published standards for the Amber
  ecosystem: XML 1.0 and 1.1 with Namespaces, a streaming reader, DOM, builder and
  XPath 1.0. Secure by default; no libxml2.

crystal: ">= 1.21.0, < 2.0.0"

license: MIT
repository: https://github.com/amberframework/mica

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    # Crystal 1.21 compatible pre-1.7.0 commit (same pin as micrate).
    commit: cdd58b34b0d8a9c785d67183a7a8f07541549e55

ai_docs:
  include:
    - README.md
    - docs/ADDING_A_FORMAT.md
